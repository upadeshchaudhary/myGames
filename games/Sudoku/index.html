<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">Sudoku</div>
        <button id="pauseBtn" class="pause-btn" title="Pause">⏸</button>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Mistakes</span>
          <span id="mistakes" class="stat-value">0/3</span>
        </div>
        <div class="stat">
          <span class="stat-label">Time</span>
          <span id="timer" class="stat-value">00:00</span>
        </div>
      </div>
    </header>

    <div class="difficulty-row">
      <select id="difficultySelect" class="diff-select">
        <option value="30">Easy</option>
        <option value="40" selected>Medium</option>
        <option value="50">Hard</option>
        <option value="58">Extreme</option>
      </select>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="pausedOverlay" class="paused-overlay">
        <span>Paused</span>
        <button id="resumeBtn" class="overlay-btn primary">Resume</button>
      </div>
    </div>

    <div id="message" class="message"></div>

    <div class="toolbar">
      <button id="undoBtn" class="tool-btn">
        <span class="tool-icon">↶</span><span>Undo</span>
      </button>
      <button id="eraseBtn" class="tool-btn">
        <span class="tool-icon">⌫</span><span>Erase</span>
      </button>
      <button id="notesBtn" class="tool-btn">
        <span class="tool-icon">✎</span><span>Notes</span>
      </button>
      <button id="hintBtn" class="tool-btn">
        <span class="tool-icon">💡</span><span>Hint <span id="hintCount">(3)</span></span>
      </button>
      <button id="newGame" class="tool-btn">
        <span class="tool-icon">＋</span><span>New</span>
      </button>
    </div>

    <div id="numpad" class="numpad"></div>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h2 id="overlayTitle">Game Over</h2>
        <p id="overlayMsg"></p>
        <div class="overlay-actions">
          <button id="retryBtn" class="overlay-btn secondary">Retry</button>
          <button id="playAgainBtn" class="overlay-btn primary">Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
