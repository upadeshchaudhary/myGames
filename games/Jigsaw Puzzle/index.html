<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Jigsaw</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="wrap">
  <header class="header">
    <a href="../../index.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      All Games
    </a>
    <h1>🧩 Daily Jigsaw</h1>
    <p class="sub">Drag & drop pieces to complete the photo!</p>
  </header>

  <div class="card">
    <div class="card-header">
      <h2 class="title" id="puzzleTitle">Loading…</h2>
      <div class="best-badge" id="bestVal">Best: --</div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timeVal">03:00</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Moves</span>
        <span class="stat-value" id="moveVal">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="scoreVal">1000</span>
      </div>
    </div>

    <!-- Play Area: Reference image + Jigsaw Board -->
    <div class="play-area">
      <div class="reference-box">
        <span class="ref-label">Target</span>
        <div class="preview-img" id="previewImg"></div>
      </div>
      <div class="board-container">
        <div class="board" id="board"></div>
      </div>
    </div>

    <div class="controls">
      <button id="restartBtn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/></svg>
        Restart
      </button>
      <button id="shuffleBtn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Shuffle
      </button>
      <button id="nextBtn" class="btn btn-secondary">
        Next Image ➔
      </button>
    </div>
  </div>
</div>

<!-- Game Over Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-icon" id="modalIcon">🎉</div>
    <h2 id="modalTitle">Puzzle Complete!</h2>
    <div class="score-display">
      <span class="score-label">Final Score</span>
      <div class="score-number" id="finalScore">0</div>
    </div>
    <p id="finalStats" class="modal-sub"></p>
    <button id="playAgainBtn" class="btn btn-primary btn-block">Play Next Puzzle</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
