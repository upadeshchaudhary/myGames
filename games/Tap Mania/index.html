<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Mania</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
  <a href="../../index.html" style="display:inline-block;margin-bottom:10px;font-size:.8rem;color:#003893;text-decoration:none;">← All Games</a>

  <!-- Start screen -->
  <div id="start-screen" class="screen active">
    <h1>TAP MANIA</h1>
    <p>How fast can you tap?</p>
    <p class="best">🏆 Best: <span id="best-score-display">0</span></p>
    <button id="start-btn">START</button>
  </div>

  <!-- Countdown screen -->
  <div id="countdown-screen" class="screen">
    <div id="countdown-number">3</div>
    <p>GET READY!</p>
  </div>

  <!-- Playing screen -->
  <div id="playing-screen" class="screen">
    <div class="hud">
      <div class="hud-item">
        <span class="label">TIME</span>
        <span id="time-display">10.0</span>
      </div>
      <div class="hud-item">
        <span class="label">SCORE</span>
        <span id="score-display">0</span>
      </div>
    </div>
    <button id="tap-btn">TAP!</button>
  </div>

  <!-- Result screen -->
  <div id="result-screen" class="screen">
    <h2>TIME'S UP!</h2>
    <div id="final-score">0</div>
    <p>TAPS</p>
    <p id="new-best-msg" class="hidden">🏆 New Personal Best!</p>
    <button id="play-again-btn">PLAY AGAIN</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
